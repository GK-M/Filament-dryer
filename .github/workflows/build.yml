name: Build firmware

on:
  push:
    paths:
      - 'firmware/v3-freertos/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'firmware/v3-freertos/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/v3-freertos/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Provide secrets header
        working-directory: firmware/v3-freertos
        run: cp include/secrets.h.example include/secrets.h

      - name: Build
        working-directory: firmware/v3-freertos
        run: pio run
